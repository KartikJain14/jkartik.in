server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # compress text assets on the fly
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    # fingerprinted build assets + self-hosted fonts never change -> cache hard
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # clean URLs: exact file -> directory index -> <name>.html -> 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # the standalone 404 page
    error_page 404 /404.html;
}
