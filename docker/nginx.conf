server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # relative redirects: /blog -> /blog/ keeps the client's scheme/host instead of
    # emitting http://… behind the TLS-terminating proxy
    absolute_redirect off;

    # one URL per page: /x/index.html -> /x/ (query string kept). Matches $request_uri,
    # not $uri, so the internal /x/ -> /x/index.html index lookup can't loop.
    if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    # compress text assets on the fly
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json image/svg+xml application/xml application/rss+xml;

    # security headers. NOTE: nginx drops ALL inherited add_header directives in any
    # location that sets its own add_header, so every such location below repeats these.
    # (HSTS lives on the host's TLS-terminating nginx, not here.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # fingerprinted build assets + self-hosted fonts never change -> cache hard
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # images aren't fingerprinted, so a month rather than forever
    # (expires isn't add_header, so the server-level headers still apply here)
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        expires 30d;
    }

    # .webmanifest isn't in nginx's mime.types (would be application/octet-stream)
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # clean URLs: exact file -> directory index -> <name>.html -> 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # the standalone 404 page. /404 is linked from the footer, so it must answer with a real 404
    # status rather than a 200 (a soft 404 to search engines).
    error_page 404 /404.html;
    location = /404 { return 404; }
    location = /404.html { internal; }
}
